name: Build Service

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  schedule:
    - cron: 40 9 * * *

jobs:
  build:
    runs-on: [ubuntu-latest]

    services:
      arangodb:
        image: arangodb:3.11.8
        env:
          ARANGO_NO_AUTH: 1
        options: >-
          --health-cmd "arangosh --server.ask-for-password false --server.authentication false --javascript.execute-string \"db._version()\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 8529:8529

    outputs:
      VERSION: ${{ steps.docker-build.outputs.VERSION }}

    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: docker-login
        name: Docker:Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - id: test
        name: Test
        shell: bash
        env:
          APP_ARANGO_HOST: localhost
          APP_ARANGO_PORT: "8529"
        run: |
          ./test.sh

      - id: pytest-upload
        name: Pytest:Upload
        uses: actions/upload-artifact@v4
        with:
          name: pytest
          path: build/pytest.xml
        if: ${{ always() }}

      - id: docker-build
        name: Docker:Build
        shell: bash
        run: |
          set -o pipefail
          ./build-service.sh 2>&1 | tee /tmp/build.log
          tail -n1 /tmp/build.log >> $GITHUB_OUTPUT

      - id: upload-openapi-artifact
        name: OpenAPI:Upload
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: build/${{ steps.docker-build.outputs.VERSION }}.json
        if: ${{ always() }}

      - id: image-push
        name: Docker:Push
        shell: bash
        run: |
          ./push.sh service

  mock-matrix:
    needs: build

    strategy:
      matrix:
        configuration: [
          {runner: ubuntu-latest, platform: amd64},
          {runner: ubuntu-24.04-arm, platform: arm64},
        ]

    runs-on: ${{ matrix.configuration.runner }}

    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: docker-login
        name: Docker:Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - id: download-openapi-artifact
        name: OpenAPI:Download
        uses: actions/download-artifact@v4
        with:
          name: openapi

      - id: docker-build
        name: Docker:Build
        run: |
          ./build-using-version.sh mock ${{ needs.build.outputs.VERSION }} ${{ matrix.configuration.platform }}

      - id: docker-push
        name: Docker:Push
        run:
          ./push.sh mock ${{ matrix.configuration.platform }}

  mock:
    runs-on: [ubuntu-latest]
    needs: [build, mock-matrix]

    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: docker-login
        name: Docker:Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - id: docker-push-latest
        name: Docker:push-latest
        run: |
          ./create-latest.sh mock

  documentation-matrix:
    needs: build

    strategy:
      matrix:
        configuration: [
          {runner: ubuntu-latest, platform: amd64},
          {runner: ubuntu-24.04-arm, platform: arm64},
        ]

    runs-on: ${{ matrix.configuration.runner }}

    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: docker-login
        name: Docker:Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - id: download-openapi-artifact
        name: OpenAPI:Download
        uses: actions/download-artifact@v4
        with:
          name: openapi

      - id: docker-build
        name: Docker:Build
        run: |
          ./build-using-version.sh documentation ${{ needs.build.outputs.VERSION }} ${{ matrix.configuration.platform }}

      - id: docker-push
        name: Docker:Push
        run:
          ./push.sh documentation ${{ matrix.configuration.platform }}

  documentation:
    runs-on: [ubuntu-latest]
    needs: [build, documentation-matrix]

    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: docker-login
        name: Docker:Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - id: docker-push-latest
        name: Docker:push-latest
        run: |
          ./create-latest.sh documentation
